<title>空载一键准备</title><link rel="stylesheet" href="visual-docking.css">
<main><h1>空载一键准备</h1>
<p>准备流程：右臂 J1～J5 回到 0°、J6 转至 −90°，升降至约 10 rad，然后停止并保持。此页面不需要电池。</p>
<div class="flow">右臂固定姿态 → 升降约 10 rad → 停止保持</div>
<div class="actions"><button id="start" disabled>一键准备</button><button id="cancel">停止本次流程</button></div>
<p>仅在点击后申请控制权；空载准备不执行放置。现场需留意机械臂及升降区域。</p>
<h2 id="phase">正在连接</h2><p id="reason"></p>
<p>实时标注：青色＝仓口可见边；黄色＝电池可见面的四条直线棱／左侧目标；紫色＝电池前端方向；蓝色＝入仓法向（深度估计）。电池按透视关系拟合，角点多帧稳定；虚线表示短暂沿用，丢失超过 0.6 秒取消标注。像素偏差不等于毫米或角度。</p><div class="cameras"><figure><img id="d435"><figcaption>D435 · 仓口</figcaption></figure><figure><img id="d405"><figcaption>D405 · 夹爪</figcaption></figure><figure><img id="astra"><figcaption>Astra · 环境</figcaption></figure></div>
</main><script src="visual-docking-fixed-v1.js?v=edges-20261116"></script></html>
