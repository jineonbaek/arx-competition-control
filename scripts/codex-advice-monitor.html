<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARX · 本地纠错连接</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e8edf5;font:15px system-ui}main{max-width:1180px;margin:auto;padding:32px}h1{font-size:27px;margin:0 0 8px}.muted{color:#a2b0c5}header{margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,section{background:#1a2331;border:1px solid #334054;border-radius:14px;padding:20px;margin-bottom:20px}.label{color:#a2b0c5;font-size:13px}.value{font-size:21px;margin-top:10px}.ok{color:#72dfaf}.bad{color:#ffba85}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px 8px;border-bottom:1px solid #334054;vertical-align:top}th{color:#a2b0c5;font-weight:500}td:first-child{white-space:nowrap}#picture{max-height:260px;max-width:100%;border-radius:8px}pre{white-space:pre-wrap;word-break:break-word;color:#c3cfe0;font:14px system-ui}.row{display:flex;gap:24px}.row>div{flex:1}.badge{font-size:13px;color:#77bfff}#warn{color:#ffba85}a{color:#8ac2ff}@media(max-width:700px){.cards{grid-template-columns:1fr}.row{display:block}main{padding:16px}td{padding:8px 3px}}
</style><main><header><h1>ARX 本地纠错连接</h1><div class="muted">车端优先 · 故障时请求 Codex · Mac 离线不等待 · 仅车端执行动作</div></header><div class="cards"><div class="card"><div class="label">机器人连接</div><div id="connection" class="value">连接中</div></div><div class="card"><div class="label">本机 Codex</div><div id="worker" class="value">等待状态</div></div><div class="card"><div class="label">队列 / 更新时间</div><div id="queue" class="value">—</div></div></div><div id="warn"></div><section><div class="row"><div><h2>当前 / 最近一次请求</h2><div id="kind" class="badge">暂无请求</div><pre id="request">正常运行时不调用模型。出现故障后这里会显示具体原因。</pre><pre id="reply"></pre></div><div><img id="picture" hidden alt="本次故障画面"></div></div></section><section><h2>实时反馈</h2><div class="muted">“已回复”不等于“已采纳”。诊断建议只供排查，不会解除夹持或直接驱动机械臂。</div><table><thead><tr><th>时间</th><th>环节</th><th>状态</th><th>说明</th></tr></thead><tbody id="events"></tbody></table></section><footer class="muted">后台自动重连，无需逐条确认。窗口关闭后后台服务继续运行。</footer></main><script>
const el=id=>document.getElementById(id),names={grasp:'抓取识别',edges:'D405 对位',ik:'逆解',route:'路径规划',diagnostic:'故障诊断'},events={requested:'已请求',received:'Mac 已接收',replied:'Codex 已回复',applied:'车端已采纳',closed:'本次请求结束',expired:'已过期',superseded:'已替换'};let lastSeq='';
async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('本机服务未响应');const s=await r.json();el('connection').textContent=s.connected?'已连接 ARX':'断开 · 后台重连中';el('connection').className='value '+(s.connected?'ok':'bad');el('worker').textContent=({idle:'待命',thinking:'正在分析',replying:'提交建议',error:'本次调用失败'})[s.phase]||s.phase;el('queue').textContent=(s.robot?.pending??0)+' 条 / '+new Date(s.updated_at*1000).toLocaleTimeString();el('warn').textContent=s.error||(s.connected&&s.robot?.version<2?'车端仍为旧版协议：连接正常，完整事件反馈等待车端更新。':'');const j=s.job;if(j){el('kind').textContent=(names[j.kind]||j.kind)+' · '+j.run;el('request').textContent=JSON.stringify(j.evidence,null,2);el('picture').hidden=!s.image;if(s.image)el('picture').src=s.image;el('reply').textContent=s.answer?'回复：'+s.answer.reason+'\n动作类型：'+s.answer.action:'';}const rows=s.robot?.events||[];el('events').replaceChildren();for(const x of rows.slice(-80).reverse()){const tr=document.createElement('tr');for(const v of [new Date(x.time*1000).toLocaleTimeString(),x.stage||names[x.kind]||x.kind,events[x.event]||x.event,x.reason||x.action||'']){const td=document.createElement('td');td.textContent=v;tr.append(td)}el('events').append(tr)}if(!rows.length)el('events').textContent='暂无纠错请求。';}catch(e){el('connection').textContent='本机连接程序未响应';el('connection').className='value bad';el('warn').textContent=e.message;}finally{setTimeout(refresh,1000)}}refresh();
</script></html>
