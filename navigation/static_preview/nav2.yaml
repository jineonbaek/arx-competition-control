planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: false
    costmap_update_timeout: 1.0
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    use_sim_time: false
