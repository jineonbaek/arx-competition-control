        chassis_mask_file: /home/arx/arx-competition-control/navigation/config/base_envelope.wkt
        enabled: true
        footprint_clearing_enabled: false
        head:
          clearing: true
          data_type: LaserScan
          expected_update_rate: 0.0
          inf_is_valid: false
          marking: true
          max_obstacle_height: 0.4
          min_obstacle_height: 0.03
          observation_persistence: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.35
          raytrace_max_range: 8.0
          raytrace_min_range: 0.35
          sensor_frame: rear_livox
          topic: /pb/head/direct_scan
        history_decay_seconds: 5.0
        mark_threshold: 0
        max_obstacle_height: 0.4
        observation_sources: bottom head
        origin_z: 0.0
        plugin: arx_base_mask::VoxelLayer
        publish_voxel_map: false
        unknown_threshold: 15
        z_resolution: 0.1
        z_voxels: 16
      width: 10
planner_server:
  ros__parameters:
    GridBased:
      allow_reverse_expansion: true
      allow_unknown: false
      lattice_filepath: /home/arx/arx-competition-control/navigation/config/omni_2cm.json
      plugin: nav2_smac_planner::SmacPlannerLattice
      smooth_path: false
      tolerance: 0.05
    costmap_update_timeout: 1.0
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    use_sim_time: false
