          enabled: true
          expected_update_rate: 0.0
          horizontal_fov_angle: 4.799655442984406
          marking: false
          max_z: 8.0
          min_z: 0.35
          model_type: 1
          observation_persistence: 0.0
          obstacle_range: 8.0
          sensor_frame: pb_nav_bottom_sensor
          topic: /pb/bottom/nav_mark
          vertical_fov_angle: 0.20943951023931956
          vertical_fov_padding: 0.0
        combination_method: 1
        decay_model: 0
        enabled: true
        evidence_topics:
        - /pb/bottom/stvl_evidence
        - /pb/head/stvl_evidence
        head_clear:
          clear_after_reading: true
          clearing: true
          data_type: PointCloud2
          decay_acceleration: 5.0
          enabled: true
          expected_update_rate: 0.0
          horizontal_fov_angle: 5.061454830783556
          marking: false
          max_z: 8.0
          min_z: 0.35
          model_type: 1
          observation_persistence: 0.0
          obstacle_range: 8.0
          sensor_frame: pb_nav_head_sensor
          topic: /pb/head/nav_mark
          vertical_fov_angle: 0.20943951023931956
          vertical_fov_padding: 0.0
        initial_history: ''
        lidar_vfov_max_rad: 0.9075712110370514
        lidar_vfov_min_rad: -0.12217304763960307
        mapping_mode: false
        mark_threshold: 0
        observation_sources: bottom_clear head_clear
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        publish_voxel_map: true
        track_unknown_space: true
        transform_tolerance: 0.3
        update_footprint_enabled: false
        use_asymmetric_lidar_fov: true
        voxel_decay: 15.0
        voxel_size: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3
      update_frequency: 10.0
      use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.42, -0.25], [0.42, 0.255], [0.41500000000000004, 0.26], [0.335,
        0.3], [0.145, 0.38], [0.13, 0.38], [-0.09, 0.29], [-0.105, 0.28], [-0.395,
        0.075], [-0.4, 0.07], [-0.4, -0.07], [-0.395, -0.075], [-0.105, -0.28], [0.13,
