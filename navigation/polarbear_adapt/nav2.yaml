controller_server:
  ros__parameters:
    FollowPath:
      CostCritic:
        consider_footprint: true
        enabled: true
        trajectory_point_step: 1
      GoalAngleCritic:
        cost_weight: 15.0
        threshold_to_consider: 0.5
      GoalCritic:
        cost_weight: 35.0
        threshold_to_consider: 0.45
      PathAlignCritic:
        enabled: true
        offset_from_furthest: 5
        threshold_to_consider: 0.1
        use_path_orientations: true
      PathFollowCritic:
        cost_weight: 18.0
        offset_from_furthest: 20
        threshold_to_consider: 0.12
      ax_max: 1.2
      ax_min: -1.2
      ay_max: 1.2
      ay_min: -1.2
      az_max: 1.2
      batch_size: 600
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      iteration_count: 1
      model_dt: 0.05
      motion_model: Omni
      plugin: nav2_mppi_controller::MPPIController
      prune_distance: 2.0
      time_steps: 40
      transform_tolerance: 0.3
      visualize: false
      vx_max: 0.5866666666666668
      vx_min: -0.5866666666666668
      vx_std: 0.3
      vy_max: 0.5866666666666668
      vy_std: 0.3
      wz_max: 0.8
      wz_std: 0.4
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: true
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.045
      yaw_goal_tolerance: 0.09
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: /localization/odometry
    progress_checker:
      movement_time_allowance: 12.0
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.025
      required_movement_radius: 0.03
    progress_checker_plugins:
    - progress_checker
    speed_limit_topic: /pb/mppi/speed_limit
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.42, -0.25], [0.42, 0.255], [0.41500000000000004, 0.26], [0.335,
        0.3], [0.145, 0.38], [0.13, 0.38], [-0.09, 0.29], [-0.105, 0.28], [-0.395,
        0.075], [-0.4, 0.07], [-0.4, -0.07], [-0.395, -0.075], [-0.105, -0.28], [0.13,
        -0.38], [0.15, -0.38], [0.34500000000000003, -0.29], [0.41500000000000004,
        -0.255]]'
      footprint_padding: 0.0
      global_frame: map
      inflation:
        chassis_mask_file: /home/arx/arx-competition-control/navigation/config/base_envelope.wkt
        cost_scaling_factor: 5.0
        inflation_radius: 0.779
        near_local_max_age: 0.5
        near_local_max_gap: 0.35
        near_local_pose_max_age: 0.65
