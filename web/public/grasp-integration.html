<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自动抓取链路预览 · ARX</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/grasp.css"><link rel="stylesheet" href="css/grasp-integration.css"><script type="module" src="js/grasp-integration.js"></script></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark">A</span><strong>D405 自动抓取链路预览</strong></div><a class="button secondary" href="/">返回控制台</a></header>
<main><div class="page-heading"><div><h1>识别 → 位姿 → 点云 → 水平路径</h1><p>一次冻结 RGB-D，各步骤使用同一画面。底盘与升降保持静止；按需采集深度，模型结束后释放显存。</p></div><span class="mode-badge">仅预览 · TCP 待标定</span></div>
<div class="grasp-actions"><label>预抓距离 <input id="distance" type="number" min="1" max="200" value="50" step="1"> mm</label><button id="start" class="button primary" disabled>识别并生成预览</button><button id="cancel" class="button secondary" disabled>取消本次计算</button><span id="status" role="status">正在连接…</span></div>
<p id="stages" role="status"></p>
<div class="grasp-grid"><section class="panel"><h2>电池识别与分割复核</h2><img id="recognition" alt="识别区域" hidden></section>
<section class="panel"><h2>FoundationPose · CAD 提手参考点</h2><img id="pose" alt="CAD 位姿叠加与 F G T 点" hidden><p class="hint">F：提手前沿，G：夹持参考点，T：夹指伸入末端。</p></section></div>
<section class="panel"><div class="panel-heading"><h2>base_link 点云与 +X 线段</h2><button id="reset" class="button secondary">重置视角</button></div><div id="viewport"></div><p class="hint">青色点云：识别到的电池表面。线段青色端点：预抓点；橙色端点：CAD 夹持参考点 G。两者 Y、Z 固定；尚不是腕部轨迹。</p></section>
<section class="panel candidates"><h2>本次结果</h2><p id="stamp"></p><dl id="metrics"></dl><p id="quality"></p><p id="blockers">TCP 未接入：腕部起终点暂不计算，不发送运动指令。</p></section>
</main></body></html>
