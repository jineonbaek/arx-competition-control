<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>视觉入仓实机流程</title><link rel="stylesheet" href="visual-docking.css">
<main><h1>电池自动入仓</h1><p>雷达到位后由 D435 修正并锁定底盘；右臂到达固定预观察位后，D405 仅做左右微调，再沿基座 +X 连续推入 160 mm、松爪并返回。</p>
<div class="flow"><b class="magenta">洋红</b> 电池正面棱　<b class="red">红色</b> 仓口可见内沿　<b class="yellow">黄色箭头</b> D405 左右修正方向　<b class="cyan">青色箭头</b> D435 仓口朝向</div>
<div class="actions"><select id="model"><option value="demo">当前演示仓</option><option value="competition">比赛上排中间仓</option></select><button id="start">完整放置并自动返回</button><button id="cancel">停止本次流程</button></div>
<h2 id="phase">正在连接</h2><p id="reason"></p><p id="metrics"></p>
<table><thead><tr><th>步骤</th><th>计划耗时</th><th>实际耗时</th><th>累计耗时</th><th>结果</th></tr></thead><tbody id="timings"><tr><td colspan="5">等待任务</td></tr></tbody></table>
<p id="vision-status">正在读取 D435 配对帧</p><div class="cameras depth-pair"><figure><img id="d435"><figcaption>D435 · 实时叠加结果</figcaption></figure><figure><img id="d435-depth"><figcaption>D435 · 同帧深度（暖色近、冷色远、黑色无效）</figcaption></figure></div>
<section class="d405-panel"><h2>D405 入仓前左右微调</h2><p id="d405-status">等待 D405 新画面</p><p id="d405-metrics">误差 —；步长 —；累计 —；次数 —</p><figure><img id="d405-horizontal"><figcaption>D405 · 红色仓口内沿、洋红电池正面棱、黄色修正箭头</figcaption></figure></section>
<section class="reference-panel"><h2>位姿与画面对比</h2><button id="record-reference">记录当前位置和画面</button><span id="reference-status">尚未读取参考</span><p id="comparison-residual">偏差：—</p>
<div class="cameras"><figure><img id="reference-d435"><figcaption>参考 · D435</figcaption></figure><figure><img id="current-d435"><figcaption>当前 · D435</figcaption></figure></div></section>
<p>流程不会停在中间：普通异常降级继续；无法安全入仓时记录原因并结束，不执行盲目推入。</p></main><script src="visual-docking.js"></script></html>
