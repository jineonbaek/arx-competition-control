<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GraspNet 抓取预览 · ARX</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/grasp.css">
<script type="module" src="js/grasp.js"></script></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark">A</span><div><strong>ARX / GRASPNET</strong><small>D405 · 右腕相机</small></div></div><a class="button secondary" href="/">返回控制台</a></header>
<main><div class="page-heading"><div><h1>GraspNet 抓取预览</h1><p>冻结 RGB-D 画面，框选电池，查看模型建议的夹取位置。</p></div><span class="mode-badge enabled">仅预览</span></div>
<div class="grasp-actions"><button class="button secondary" id="capture">采集新画面</button><button class="button primary" id="infer" disabled>生成抓取候选</button><span id="status" role="status">正在读取上次预览…</span></div>
<div class="grasp-grid">
<section class="panel"><div class="panel-heading"><h2>D405 彩色快照</h2><span id="stamp" class="subtle-tag"></span></div><canvas id="photo" width="640" height="480" aria-label="在快照中拖动框选目标"></canvas><p class="hint">拖动框选目标。黄色框用于推理，青色夹爪对应当前候选。</p></section>
<section class="panel"><div class="panel-heading"><h2>三维点云</h2><button class="button secondary" id="reset">重置视角</button></div><div id="viewport"></div><p class="hint">拖动旋转，滚轮缩放。青色显示夹爪张开方向和接近方向。</p></section></div>
<section class="panel candidates"><div class="panel-heading"><h2>抓取候选</h2><span id="counts" class="subtle-tag">尚未推理</span></div>
<div class="grasp-actions"><label for="candidate">按模型评分排序</label><select id="candidate" disabled></select><button class="button secondary" id="prev" disabled>上一个</button><button class="button secondary" id="next" disabled>下一个</button></div>
<dl id="metrics"></dl><p class="hint">开口为模型建议值。点云过滤不含 X5 关节可达性、实机开口限位或整臂碰撞验证。</p></section></main></body></html>
