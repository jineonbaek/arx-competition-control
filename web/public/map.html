<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARX · 地图与任务</title>
  <link rel="stylesheet" href="css/map.css">
  <script type="module" src="js/map.js"></script>
</head>
<body>
  <header><strong>ARX / 地图与任务</strong><a href="/">返回控制台</a></header>
  <main>
    <section class="map-panel">
      <div class="toolbar"><h1>实时地图</h1><span id="connection" role="status">连接中</span></div>
      <div class="viewport"><canvas id="map" aria-label="雷达地图、机器人位置和规划路径"></canvas><p id="empty">等待 /pb/map 地图数据</p></div>
      <div class="legend"><span>深色 · 障碍</span><span>灰色 · 未知</span><span>蓝线 · 规划路径</span><span>橙色箭头 · 机器人</span></div>
      <p id="map-info">地图坐标尚未就绪</p>
      <p>地图使用导航坐标系；比赛场地图需完成现场配准后叠加。</p>
    </section>
    <aside>
      <section><h2>定位</h2><strong id="pose-state">等待反馈</strong><p id="pose-value">—</p><p id="pose-age">—</p><p id="path-state">—</p></section>
      <section>
        <h2>整场比赛总控</h2>
        <p id="target">无人机指定左上角电池 → 电池柜红框 A 口</p>
        <label class="clearance"><input id="environment-clear" type="checkbox">已确认本轮作业区无人且无临时障碍</label>
        <div class="task-actions">
          <button id="competition-start" type="button" disabled>开始比赛</button>
          <button id="competition-stop" class="stop" type="button" disabled>停止比赛</button>
          <button id="competition-continue" type="button" disabled>检查并继续</button>
        </div>
        <strong id="task-state" role="status">等待反馈</strong>
        <p id="phase">—</p><p id="mission"></p><p id="reason" role="status"></p>
        <p id="navigation-state"></p><p id="navigation-handoff"></p>
        <p id="task-message" role="alert"></p><p id="run"></p><ol id="stages"></ol>
        <p><a href="/grasp-integration.html">查看抓取视觉与执行详情</a></p>
        <details><summary>任务与异常恢复记录</summary><ol id="task-logs"></ol></details>
      </section>
    </aside>
  </main>
</body>
</html>
